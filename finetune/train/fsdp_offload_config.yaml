# Fallback launcher config for train_radagon_moe.py when deepspeed is NOT
# installed in ~/erdtree-train/venv. FSDP FULL_SHARD with parameter + gradient +
# optimizer CPU offload: the bf16 weights live in the 125 GB of host RAM and only
# the layer currently executing is materialized on the GPUs.
#
# Slower than ZeRO-3 offload for this shape (FSDP offload has no
# DeepSpeedCPUAdam-style fused CPU optimizer), but it needs no extra packages.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  fsdp_activation_checkpointing: false
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_cpu_ram_efficient_loading: true
  fsdp_forward_prefetch: false
  fsdp_offload_params: true
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
use_cpu: false
